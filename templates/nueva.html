{% extends "base.html" %}
{% block titulo %}Registrar{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div>
    <p class="etiqueta"><a href="/instrucciones">Instrucciones</a> / Nueva</p>
    <h1>Registrar instrucción</h1>
  </div>
</div>
<div class="panel formulario-panel">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="POST" action="/instrucciones/nueva" enctype="multipart/form-data" class="formulario">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" value="{{ datos['titulo'] }}" placeholder="Ej. Corte de papel en guillotina">
    <label for="proceso">Proceso</label>
    <input type="text" id="proceso" name="proceso" value="{{ datos['proceso'] }}" placeholder="Ej. Corte">
    <label for="version">Versión</label>
    <input type="text" id="version" name="version" value="{{ datos['version'] }}" inputmode="numeric" placeholder="1">
    <fieldset class="grupo">
      <legend>Documento de la instrucción <span class="opcional">(opcional, puedes subirlo después)</span></legend>
      <label for="documento">Archivo PDF o Word (máximo {{ maximo }} MB)</label>
      <input type="file" id="documento" name="documento" accept=".pdf,.doc,.docx">
      <label for="enlace_video">Enlace del video <span class="opcional">(opcional)</span></label>
      <input type="text" id="enlace_video" name="enlace_video" value="{{ datos['enlace_video'] }}" placeholder="https://youtube.com/…">
    </fieldset>
    <div class="botones">
      <button type="submit" class="boton">Guardar instrucción</button>
      <a class="boton boton-secundario" href="/instrucciones">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
